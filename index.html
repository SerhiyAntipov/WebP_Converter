<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>WebP Converter</title>

  <!-- Browser and device icons -->
  <link rel="icon" href="./favicon/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
  <link rel="manifest" href="./favicon/site.webmanifest" />

  <link rel="stylesheet" href="./static/style.css" />
  <script src="./static/script.js" defer></script>
</head>

<body>
  <main>
    <!-- Image upload, list, and download actions -->
    <aside id="sidebarColumn" aria-label="Image controls">
      <div class="brand">
        <h2>
          <span>WebP</span>
          <img src="./favicon/android-chrome-192x192.png" alt="" />
          <span>CONVERTER</span>
        </h2>
      </div>

      <input id="imageInput" class="visuallyHidden" type="file" accept="image/*" multiple />
      <div id="uploadControl">
        <span id="uploadTooltip" role="status" hidden>
          Choose an image<br />to get started.
        </span>
        <label id="uploadButton" for="imageInput">Choose Images</label>
      </div>

      <aside id="imageSidebar" aria-label="Uploaded images">
        <div class="imageListHeading">
          <h2>Images</h2>
          <span id="imageCount">0 / 20 max</span>
        </div>
        <p id="imageListStatus" role="status" aria-live="polite" hidden></p>
        <ul id="imageList" aria-live="polite"></ul>
      </aside>

      <a id="downloadButton" href="#" aria-disabled="true" download="converted.webp">
        <span id="downloadButtonLabel">Download WebP</span>
        <span id="downloadProgressContainer" hidden>
          <progress id="downloadProgress" max="100" value="0" aria-label="Download progress"></progress>
          <span id="downloadProgressValue">0%</span>
        </span>
      </a>
      <button id="clearImagesButton" type="button" disabled>Clear All</button>
    </aside>

    <!-- Image comparison and conversion settings -->
    <section id="workspace" aria-label="Image converter">
      <div class="brand">
        <h1>
          <span>WebP</span>
          <img src="./favicon/android-chrome-192x192.png" alt="" />
          <span>CONVERTER</span>
        </h1>
      </div>

      <div id="imageComparison">
        <img id="originalImage" class="comparisonImage" alt="Original image" />
        <div class="comparisonAfter">
          <img id="convertedImage" class="comparisonImage comparisonImageConverted" alt="Image converted to WebP" />
        </div>

        <span class="comparisonLabel comparisonLabelBefore">Before</span>
        <span class="comparisonLabel comparisonLabelAfter">After</span>
        <span id="sampleImageNotice" class="comparisonLabel" hidden>Sample Image</span>
        <span class="comparisonDivider" aria-hidden="true"><span></span></span>
        <input id="comparisonSlider" class="comparisonSlider" type="range" min="0" max="100" value="50"
          aria-label="Compare image before and after conversion" aria-controls="imageComparison"
          aria-valuetext="Divider at 50% of the image width" />
      </div>

      <fieldset id="converterControls" aria-label="Conversion settings">
        <div id="qualityControl">
          <input id="qualitySlider" type="range" min="0" max="100" value="80" step="5" />
          <label for="qualitySlider">Quality: <span id="qualityValue">80</span>%</label>
        </div>

        <div id="scaleControl">
          <input id="comparisonScale" type="range" min="0.1" max="300" value="0.1" step="0.1" aria-label="Image zoom"
            aria-controls="imageComparison" />
          <label for="comparisonScale">Zoom: <span id="comparisonScaleValue">100</span>%</label>
        </div>
      </fieldset>

      <div id="converterInfo" aria-live="polite">
        <p id="originalSize"></p>
        <p id="webpSize"></p>
        <p id="sizeChange" class="sizeReduction"></p>
      </div>
    </section>
  </main>
</body>

</html>
