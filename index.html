<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebP Converter</title>

  <link rel="stylesheet" href="./static/style.css" />
</head>

<body>
  <main>
    <h1>WebP CONVERTER</h1>
    <div id="imageComparison" class="imageComparison">
      <img id="originalImage" class="comparisonImage" alt="Original image" />
      <div class="comparisonAfter">
        <img id="convertedImage" class="comparisonImage comparisonImageConverted" alt="Image converted to WebP" />
      </div>
      <span class="comparisonLabel comparisonLabelBefore">Before</span>
      <span class="comparisonLabel comparisonLabelAfter">After</span>
      <span class="comparisonDivider" aria-hidden="true"><span></span></span>
      <input type="range" id="comparisonSlider" class="comparisonSlider" min="0" max="100" value="50"
        aria-label="Compare image before and after conversion" aria-controls="imageComparison"
        aria-valuetext="Divider at 50% of the image width" />
    </div>
    <div class="converterPanel">
      <div id="converterControls">
        <input type="file" id="imageInput" accept="image/*" class="visuallyHidden" />
        <label for="imageInput" id="uploadButton">Choose Image</label>

        <div class="scaleControl">
          <input type="range" id="comparisonScale" min="100" max="300" value="100" step="1"
            aria-label="Image zoom" aria-controls="imageComparison" />
          <label for="comparisonScale">Zoom: <span id="comparisonScaleValue">100</span>%</label>
        </div>

        <div class="qualityControl">
          <input type="range" id="qualitySlider" min="0" max="100" value="80" step="5" />
          <label for="qualitySlider">Quality: <span id="qualityValue">80</span>%</label>
        </div>
        <a id="downloadLink" hidden download="converted.webp">Download WebP</a>
      </div>
      <div id="conversionResults">
        <p id="originalSize"></p>
        <p id="webpSize"></p>
        <p id="sizeChange"></p>
      </div>
    </div>
  </main>
  <script src="./static/script.js"></script>
</body>

</html>
