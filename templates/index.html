<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebP Converter</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <h1>WebP Converter</h1>

    <div id="imgWrapper" hidden>
      <img id="preview" alt="Попередній перегляд вибраного зображення" />
    </div>

    <label for="fileInput">Виберіть зображення:</label>
    <input type="file" id="fileInput" accept="image/*" />

    <div class="qualityControl">
      <input type="range" id="quality" min="0" max="100" value="80" step="5" />
      <label for="quality">Якість: <span id="qualityValue">80</span>%</label>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <a id="downloadLink" hidden download="converted.webp">Завантажити WebP</a>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
